[workspace]
members = ["derive"]

[package]
name = "uklad"
version = "2.0.1"
edition = "2024"
rust-version = "1.85"
description = "A compact binary encoder and decoder"
repository = "https://github.com/bgw/uklad"
documentation = "https://docs.rs/uklad"
categories = ["encoding", "network-programming"]
keywords = ["binary", "encode", "decode", "serialize", "deserialize"]

[features]
default = ["std", "derive"]
std = ["alloc", "serde?/std"]
alloc = ["serde?/alloc"]
derive = ["dep:uklad_derive"]

[dependencies]
uklad_derive = { path = "derive", version = "2.0.1", optional = true }
serde = { version = "1.0", default-features = false, optional = true }
unty = "0.0.5"

[dev-dependencies]
ouroboros = "0.18.3"
serde_derive = "1.0"
serde_json = "1.0"
tempfile = "3.2"
uuid = { version = "1.1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
glam = { version = "0.25", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
bumpalo = { version = "3.16.0", features = ["collections"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
